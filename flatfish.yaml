dataset:
  source: fmb-quibdo/marshall-diary
  splits:
  - train
  image_column: image
  name_column: name
processing:
  extract_entities: true
  entity_context: true
prompts:
  text_extraction: "You are a historical document transcription assistant. Given the\
    \ raw OCR/HTR \noutput from a handwritten document, clean up and correct the text\
    \ while:\n\n1. Preserving the original spelling, including archaic forms\n2. Fixing\
    \ obvious OCR errors (e.g., 'tbe' → 'the')\n3. Maintaining original line breaks\
    \ where meaningful\n4. Preserving original punctuation style\n5. Marking unclear\
    \ or illegible portions with [?] or [illegible]\n6. Expanding common abbreviations\
    \ only if unambiguous\n\nRaw OCR text:\n{raw_text}\n\nCleaned transcription:"
  ner_extraction: "You are a historical document analyst specializing in named entity\
    \ recognition.\nExtract all named entities from the following transcribed document\
    \ text.\n\nFor each entity, provide:\n1. The exact text as it appears\n2. The\
    \ entity type (PERSON, ORGANIZATION, LOCATION, DATE, MONEY, LEGAL_TERM, EVENT,\
    \ DOCUMENT, OCCUPATION, RELATIONSHIP)\n3. A contextual description explaining\
    \ the entity's role in THIS document\n   (e.g., not just \"Person\" but \"Person;\
    \ the plaintiff filing the complaint\")\n\nDocument text:\n{document_text}\n\n\
    Return entities as a JSON array:\n[\n  {{\n    \"text\": \"John Smith\",\n    \"\
    type\": \"PERSON\", \n    \"context\": \"Person; the plaintiff filing the complaint\
    \ against the estate\"\n  }}\n]"
  summary: "You are a historian analyzing a sequence of related documents. The documents\
    \ \nare provided in chronological order with their dates/timestamps.\n\nAnalyze\
    \ these documents and provide:\n\n## Timeline of Events\nA chronological list\
    \ of key events mentioned or implied across the documents.\nInclude dates (exact\
    \ or approximate) and brief descriptions.\n\n## Key Changes\nIdentify significant\
    \ changes between documents:\n- Shifts in tone, position, or claims\n- New information\
    \ introduced\n- Contradictions or amendments to previous statements\n- Changes\
    \ in parties involved\n\n## Research Questions\nSuggest 3-5 historical research\
    \ questions that emerge from these documents:\n- Gaps in the record that warrant\
    \ investigation\n- Connections to broader historical contexts\n- Potential related\
    \ sources to consult\n- Unanswered questions about motivations or outcomes\n\n\
    Documents:\n{documents}"
summary:
  enabled: true
  model: qwen-vl-max
  sample_size: 0
  include_timeline: true
  include_key_changes: true
  include_research_questions: true
output:
  transcriptions_dir: transcriptions
  entities_dir: entities
  summaries_dir: summaries
  site_dir: _site
website:
  title: Marshall Diary
  emoji: "📔"
  background_color: "#2d3748"
  accent_color: "#4a5568"
  password: marshall
  enable_search: true
  enable_browse_dates: true
  enable_browse_entities: true
  default_sort: date
